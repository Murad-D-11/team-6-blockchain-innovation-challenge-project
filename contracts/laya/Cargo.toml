[package]
name = "laya"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# Exact pin: 30.0.0-rc.1 is the only 30.x release on crates.io (stable is 29.0.1).
# SPEC.md allows rc.1 ("Laya needs no Protocol 30 features"). Nobody upgrades after Nov 5.
soroban-sdk = "=30.0.0-rc.1"

[dev-dependencies]
soroban-sdk = { version = "=30.0.0-rc.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
